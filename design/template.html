<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --txt: rgba(255,255,255,.93);
    --txt-dim: rgba(255,255,255,.55);
    --glass-bg: linear-gradient(135deg, rgba(255,255,255,.11), rgba(255,255,255,.045));
    --glass-border: rgba(255,255,255,.14);
  }

  html, body { background: #0B0E14; }

  .scene {
    position: relative;
    width: 830px;
    overflow: hidden;
    font-family: -apple-system, "SF Pro Display", "PingFang SC", "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .scene.banner { height: 300px; }
  .scene.card   { height: 190px; }

  /* ---- 背景：深底 + 柔和彩色光斑（低饱和，避免花哨） ---- */
  .bg { position: absolute; inset: 0; background: #0B0E14; }
  .blob { position: absolute; border-radius: 50%; filter: blur(90px); }
  .b1 { width: 520px; height: 520px; left: -140px; top: -180px;  background: rgba(88, 68, 160, .55); }
  .b2 { width: 460px; height: 460px; right: -120px; bottom: -200px; background: rgba(30, 96, 118, .5); }
  .b3 { width: 300px; height: 300px; right: 220px; top: -120px; background: rgba(150, 84, 52, .34); }

  /* ---- 玻璃材质 ---- */
  .glass {
    position: absolute;
    background: var(--glass-bg);
    backdrop-filter: blur(30px) saturate(170%);
    -webkit-backdrop-filter: blur(30px) saturate(170%);
    border: 1px solid var(--glass-border);
    border-radius: 28px;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.28),
      inset 0 -1px 0 rgba(255,255,255,.05),
      inset 1px 0 0 rgba(255,255,255,.09),
      0 24px 48px rgba(0,0,0,.45);
  }
  /* 顶部对角反光 */
  .glass::before {
    content: '';
    position: absolute; inset: 0;
    border-radius: inherit;
    background: radial-gradient(120% 90% at 18% 0%, rgba(255,255,255,.14), transparent 46%);
    pointer-events: none;
  }

  /* ---- banner ---- */
  .banner .glass { left: 12px; right: 12px; top: 12px; bottom: 12px; display: flex; flex-direction: column; justify-content: center; padding: 0 52px; }
  .banner h1 {
    font-size: 58px; font-weight: 600; letter-spacing: .12em; color: var(--txt);
  }
  .banner .sub {
    margin-top: 14px; font-size: 17px; font-weight: 400; letter-spacing: .04em; color: var(--txt-dim);
  }
  .banner .sub .handle { font-weight: 500; color: rgba(255,255,255,.72); }
  .banner .dot { display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: rgba(255,255,255,.4); margin: 0 12px 3px; }

  /* ---- 项目卡 ---- */
  .card .glass { left: 12px; right: 12px; top: 12px; bottom: 12px; display: flex; align-items: center; padding: 0 44px; gap: 36px; }
  .card .repo { flex: 1; min-width: 0; }
  .card h2 { font-size: 26px; font-weight: 600; letter-spacing: .02em; color: var(--txt); }
  .card p  { margin-top: 10px; font-size: 15.5px; line-height: 1.55; color: var(--txt-dim); }
  .card .lang {
    flex-shrink: 0; font-size: 13px; font-weight: 500; letter-spacing: .03em;
    color: rgba(255,255,255,.78);
    padding: 8px 18px; border-radius: 999px;
    background: rgba(255,255,255,.09);
    border: 1px solid rgba(255,255,255,.14);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.2);
  }
</style>
</head>
<body>
<div class="scene" id="scene">
  <div class="bg"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>
  <div class="frame" id="frame"></div>
</div>

<script>
  const DATA = {
    banner: { cls: 'banner', html: `
      <div class="glass">
        <h1>枭钰钰</h1>
        <div class="sub"><span class="handle">xiaoyuyu6420</span><span class="dot"></span>独立开发者，写小工具</div>
      </div>` },
    dsh: { cls: 'card', html: `
      <div class="glass">
        <div class="repo"><h2>dsh-backup</h2><p>DeepSeek Harness 的备份插件，一条命令备份和恢复整个 ~/.dsh</p></div>
        <div class="lang">JavaScript</div>
      </div>` },
    anykey: { cls: 'card', html: `
      <div class="glass">
        <div class="repo"><h2>anykey-ai</h2><p>RK R87 Pro AI 键盘的自定义功能键和麦克风桥接，不装官方软件</p></div>
        <div class="lang">Electron</div>
      </div>` },
    shiping: { cls: 'card', html: `
      <div class="glass">
        <div class="repo"><h2>shiping</h2><p>口播短视频流水线 skill，从调研到成片</p></div>
        <div class="lang">Skill</div>
      </div>` },
    scanforge: { cls: 'card', html: `
      <div class="glass">
        <div class="repo"><h2>scanforge</h2><p>安卓上的物体 3D 扫描，不依赖 ARCore</p></div>
        <div class="lang">Kotlin</div>
      </div>` },
    deck: { cls: 'card', html: `
      <div class="glass">
        <div class="repo"><h2>agent-deck</h2><p>看各路 agent 状态的面板</p></div>
        <div class="lang">Rust</div>
      </div>` },
  };

  const key = new URLSearchParams(location.search).get('s') || 'banner';
  const d = DATA[key];
  const scene = document.getElementById('scene');
  scene.classList.add(d.cls);
  document.getElementById('frame').innerHTML = d.html;
  document.title = key;
</script>
</body>
</html>
